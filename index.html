<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense & Budget Visualizer</title>
    <!-- CSS File -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Chart.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header & Dark Mode Toggle -->
        <header class="header">
            <h1>Expense & Budget Visualizer</h1>
            <button id="theme-toggle-btn" class="btn-secondary">🌙 Dark Mode</button>
        </header>

        <!-- Display Total Balance -->
        <section class="card balance-card">
            <h2>TOTAL BALANCE</h2>
            <div id="total-balance" class="balance-amount">$0.00</div>
        </section>

        <!-- Form Add Transaction -->
        <section class="card form-card">
            <h2>Add Transaction</h2>
            <form id="transaction-form">
                <div class="form-group">
                    <label for="item-name">Item Name</label>
                    <input type="text" id="item-name" placeholder="e.g. Cilok" required>
                </div>
                
                <div class="form-group">
                    <label for="amount">Amount ($)</label>
                    <input type="number" id="amount" step="0.01" placeholder="e.g. 14.94" required>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Fun">Fun</option>
                    </select>
                </div>

                <!-- Custom Category -->
                <div class="form-group">
                    <label for="custom-category">Or Add Custom Category</label>
                    <div class="inline-input">
                        <input type="text" id="custom-category" placeholder="New category name">
                        <button type="button" id="add-category-btn" class="btn-secondary">Add</button>
                    </div>
                </div>

                <button type="submit" class="btn-primary">Add Transaction</button>
            </form>
        </section>

        <!-- Sort Control -->
        <section class="card controls-card">
            <div class="form-group inline-group">
                <label for="sort-by">Sort By:</label>
                <select id="sort-by">
                    <option value="default">Default (Newest First)</option>
                    <option value="amount-desc">Amount (High to Low)</option>
                    <option value="amount-asc">Amount (Low to High)</option>
                    <option value="category">Category</option>
                </select>
            </div>
        </section>

        <!-- Output Grid: Transaction List & Chart -->
        <div class="main-grid">
            <section class="card list-card">
                <h2>Transactions</h2>
                <div id="transaction-list" class="transaction-list"></div>
            </section>

            <section class="card chart-card">
                <h2>Spending by Category</h2>
                <div class="chart-container">
                    <canvas id="spending-chart"></canvas>
                </div>
            </section>
        </div>
    </div>

    <!-- JS File -->
    <script src="js/script.js"></script>
</body>
</html>
